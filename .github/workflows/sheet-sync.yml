# Sync Google Sheets → S3 (hot schedule or cold catalog). Triggered from Apps Script via content-admin API.
name: Sheet sync

on:
  workflow_dispatch:
    inputs:
      tier:
        description: hot (schedule) or cold (catalog)
        required: true
        type: choice
        options:
          - hot
          - cold

concurrency:
  group: sheet-sync-publication
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      GOOGLE_DRIVE_AUTH: service_account
      GOOGLE_MEDIA_DRIVE_FOLDER_ID: ${{ vars.GOOGLE_MEDIA_DRIVE_FOLDER_ID }}
      GOOGLE_MEDIA_DRIVE_INBOX_SUBFOLDER: Sync
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install web dependencies
        run: npm ci
        working-directory: apps/web

      - name: Install scripts dependencies
        run: npm ci --omit=dev
        working-directory: scripts

      - name: Pull media inbox from Drive
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: node scripts/pull-media-inbox-from-drive.mjs

      - name: Sync from Google Sheets
        env:
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          S3_ENDPOINT: ${{ vars.S3_ENDPOINT }}
          AWS_DEFAULT_REGION: ru-central1
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SHEETS_HOT_SPREADSHEET_ID: ${{ vars.GOOGLE_SHEETS_HOT_SPREADSHEET_ID }}
          GOOGLE_SHEETS_HOT_RANGE_GROUPS: "'Группы'!A:AZ"
          GOOGLE_SHEETS_HOT_RANGE_FORMATS: "'Форматы'!A:AZ"
          GOOGLE_SHEETS_COLD_SPREADSHEET_ID: ${{ vars.GOOGLE_SHEETS_COLD_SPREADSHEET_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node scripts/run-sheet-sync.mjs ${{ inputs.tier }}

      - name: Validate snapshots
        run: node scripts/validate-public-snapshot.mjs

      - name: Upload hot schedule to S3
        if: inputs.tier == 'hot'
        env:
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          S3_ENDPOINT: ${{ vars.S3_ENDPOINT }}
          AWS_DEFAULT_REGION: ru-central1
        run: node scripts/run-s3-sync.mjs data-hot

      - name: Archive annual card refresh evidence
        if: always() && inputs.tier == 'hot'
        uses: actions/upload-artifact@v4
        with:
          name: annual-mos-refresh
          path: apps/web/content/annual-mos-refresh.generated.json
          retention-days: 30

      - name: Require complete annual refresh coverage
        if: inputs.tier == 'hot'
        run: node -e 'const r = require("./apps/web/content/annual-mos-refresh.generated.json"); if (!r.ok) { console.error(`Annual refresh incomplete ${r.verifiedGroups}/${r.expectedGroups}; validated last-known values preserved`); process.exit(1); }'

      - name: Upload cold catalog to S3
        if: inputs.tier == 'cold'
        env:
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          S3_ENDPOINT: ${{ vars.S3_ENDPOINT }}
          AWS_DEFAULT_REGION: ru-central1
        run: node scripts/run-s3-sync.mjs data-cold

      - name: Upload media to S3 (cold only)
        if: inputs.tier == 'cold'
        env:
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          S3_ENDPOINT: ${{ vars.S3_ENDPOINT }}
          AWS_DEFAULT_REGION: ru-central1
        run: node scripts/run-s3-sync.mjs media

      - name: Timeweb deploy (cold only)
        if: inputs.tier == 'cold'
        env:
          TIMEWEB_API_TOKEN: ${{ secrets.TIMEWEB_API_TOKEN }}
          TIMEWEB_APP_ID: ${{ vars.TIMEWEB_APP_ID }}
          GITHUB_SHA: ${{ github.sha }}
        run: node scripts/timeweb-deploy.mjs

      - name: Notify Telegram on failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          INPUT_TIER: ${{ inputs.tier }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_WORKFLOW: ${{ github.workflow }}
        run: node scripts/notify-sheet-sync-failure.mjs
