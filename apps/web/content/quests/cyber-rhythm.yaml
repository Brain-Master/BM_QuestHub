story: >
  Инженерный интенсив без вымышленной вселенной: ребёнок последовательно проходит этапы «звук → инструменты → корпус и электроника → сборка», чтобы в конце включить свою Bluetooth-колонку. Рамка программы BrainMaster и честные формулировки по сложности — как в методике на Drive.
skillsParent: >
  3D-моделирование и печать (TinkerCAD), базовая акустика и устройство динамика, безопасная пайка и монтаж электроники, сборка и отделка корпуса, работа в группе и демонстрация изделия.
loot: >
  Итоговый артефакт — Bluetooth-колонка собственной сборки.

  Ориентир по смыслу программы по дням (рабочие названия тем): день 1 — 3D-свисток; день 2 — 3D-арфа (однострунная); день 3 — акустика и корпус колонки; день 4 — пайка; день 5 — финальная сборка устройства. Поминутные планы — в методике на Drive и exported-md в материалах квеста.
approach: >
  Безопасность и контроль наставников (пайка, инструменты, материалы) — по регламенту площадки и методике.
  Инженерная культура: измерение, проверка гипотез, итерация до результата.
  Командная работа и обратная связь по кругу — по сценарию дней в методике.
